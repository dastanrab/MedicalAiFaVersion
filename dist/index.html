<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical AI Mobile App UI</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
    }

    #root {
      height: 100%;
    }

    /* White clean medical loader */
    .app-loader {
      position: fixed;
      inset: 0;
      background:
              radial-gradient(circle at top right, rgba(120, 200, 255, 0.15), transparent 35%),
              radial-gradient(circle at bottom left, rgba(0, 140, 255, 0.08), transparent 40%),
              #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 9999;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 42px 56px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
              0 10px 40px rgba(0, 120, 255, 0.08),
              0 2px 10px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 140, 255, 0.08);
    }

    /* Medical icon */
    .loader-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
    }

    .loader-icon svg {
      width: 100%;
      height: 100%;
      animation: pulse 1.8s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(0, 153, 255, 0.25));
    }

    /* Blue spinner */
    .loader-spinner {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 4px solid rgba(0, 153, 255, 0.12);
      border-top-color: #1da1ff;
      border-right-color: #66c7ff;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 18px rgba(0, 153, 255, 0.18);
    }

    /* Text */
    .loader-text {
      margin-top: 22px;
      color: #1593ff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
      font-family:
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Roboto,
              sans-serif;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(0.92);
        opacity: 0.75;
      }
    }
  </style>


  <script type="module" crossorigin src="/assets/index-BEYOkVvd.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CIfA2oQ6.css">
</head>

<body>
<div id="root">
  <div class="app-loader">
    <div class="loader-container">
      <div class="loader-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="url(#grad)" />
          <path
                  d="M12 7V17M7 12H17"
                  stroke="white"
                  stroke-width="2.4"
                  stroke-linecap="round"
          />
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="24" y2="24">
              <stop offset="0%" stop-color="#59c7ff"/>
              <stop offset="100%" stop-color="#008cff"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <div class="loader-spinner"></div>
      <div class="loader-text">در حال بارگذاری...</div>
    </div>
  </div>
</div>
</body>
</html>
